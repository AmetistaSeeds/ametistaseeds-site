<script src="/s.js" defer></script>

</head>
<body>
<header class="topo">
  <div class="envolve">
    <a class="marca" href="index.html" aria-label="Ametista Seeds — Início">
      <img src="assets/img/simbolo-claro.svg" alt="" width="31" height="38">
      <span class="nome"><span class="am">AMETISTA</span> <span class="sd">SEEDS</span></span>
    </a>
    <nav class="idiomas"><a href="contato.html" hreflang="pt-BR" lang="pt-BR" aria-current="true">PT</a> <a href="en/contact.html" hreflang="en" lang="en">EN</a> <a href="de/kontakt.html" hreflang="de" lang="de">DE</a></nav>
  </div>
</header>
<main class="legal">
  <div class="envolve">
<h1>Contato</h1>
<p class="sub">Quer falar comigo? Escreva aqui — respondo por e-mail, normalmente em poucos dias.</p>
<form id="cform" class="cform" novalidate>
<label class="f">Seu nome (opcional)<input type="text" name="name" maxlength="120" autocomplete="name"></label>
<label class="f">Seu e-mail<input type="email" name="email" required maxlength="200" autocomplete="email" inputmode="email"></label>
<label class="f">Mensagem<textarea name="message" required maxlength="5000" rows="7"></textarea></label>
<label class="hp" aria-hidden="true">Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
<p><button type="submit" class="enviar">Enviar mensagem</button></p>
<p class="status" id="cst" role="status" aria-live="polite"></p>
</form>
<p class="sub">Uso o seu nome, e-mail e mensagem só para responder. Mais detalhes em <a href="privacidade.html">Privacidade</a>. E-mail: <a href="mailto:contato@ametistaseeds.com">contato@ametistaseeds.com</a></p>
<style>.cform{display:grid;gap:14px;margin:1.5rem 0}.cform .f{display:grid;gap:6px}.cform input,.cform textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:inherit}.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.cform .enviar{font:inherit;padding:10px 22px;border-radius:999px;border:0;background:var(--botao,#9D3D3C);color:#fff;cursor:pointer}.cform .enviar:disabled{opacity:.6}.cform .status{min-height:1.4em}</style>
<script>
(function(){var f=document.getElementById("cform"),s=document.getElementById("cst"),t0=Date.now(),FAIL='Não foi possível enviar agora. Tente de novo em alguns minutos ou escreva para contato@ametistaseeds.com.';
f.addEventListener("submit",function(e){e.preventDefault();var d=Object.fromEntries(new FormData(f));
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email||"")||!(d.message||"").trim()){s.textContent='Preencha um e-mail válido e a mensagem.';return;}
d.ms=Date.now()-t0;d.lang="pt";d.page=location.href;var b=f.querySelector("button");b.disabled=true;s.textContent='Enviando…';
fetch("/api/contato",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)}).then(function(r){
if(r.ok){f.reset();s.textContent='Mensagem enviada. Obrigada! Vou responder no e-mail que você indicou.';}else{s.textContent=FAIL;b.disabled=false;}
}).catch(function(){s.textContent=FAIL;b.disabled=false;});});})();
</script>
  </div>
</main>
